# Service Port
server.port=8082

# Application Name (for Eureka registration)
spring.application.name=INFLUENCER-SERVICE

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console-influencer
spring.datasource.url=jdbc:h2:mem:influencerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use "validate" or "none" in prod. "create-drop" is also an option for dev.
spring.jpa.hibernate.ddl-auto=update

# Security: OAuth2 Resource Server (JWT) Configuration
# This secret MUST be the same as the one used by your User Service (Auth Server) to sign the JWTs.
# In a real production scenario, you'd use asymmetric keys (public/private key pair) or a centralized auth server.
# For this guide, we're using a shared symmetric secret.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri= \
 # Leave empty if using MAC (symmetric key)
# If User Service exposes a JWK Set URI (for asymmetric keys), put it here.
# For symmetric secret key:
# We will configure the NimbusJwtDecoder bean manually using the secret.
jwt.secret=YourSuperSecretKeyForJWTsWhichIsLongAndSecure12345ShouldBeInEnvVar